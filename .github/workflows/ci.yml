name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Code style and lint check (Ruff)
        run: |
          ruff check --line-length=120 --ignore E501,BLE001,TRY004,UP,B017,I001 dynamic_math_engine.py test_dynamic_math.py

      - name: Run unit tests (Pytest)
        run: |
          pytest test_dynamic_math.py -v
